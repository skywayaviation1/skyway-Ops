# Local Supabase project for the Skyway control plane.
# Phase 1 schema lives in supabase/migrations and also applies with plain psql.
# Docs: https://supabase.com/docs/guides/local-development/cli/config
#
# `supabase start` (Docker) or `node scripts/apply-control-plane.mjs` both
# apply the same SQL. The live app does not connect until DATABASE_URL is set.

project_id = "skyway-ops"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 16

[db.migrations]
enabled = true

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://www.skyway.app"

[storage]
enabled = true

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#060C16" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Skyway" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Skyway Aviation Ops</title>
    <!-- Fonts are loaded here only. Preconnecting saves a round trip versus
         discovering the Google Fonts origin from an @import inside CSS. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <!-- Apply saved theme BEFORE React mounts so there's no flash of wrong colors. -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('skyway-theme');
          if (t === 'classy') document.documentElement.setAttribute('data-theme', 'classy');
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Loading splash — shown before React mounts. Inline styles only. -->
      <div style="
        position: fixed; inset: 0;
        background: #060C16;
        display: flex; align-items: center; justify-content: center;
        flex-direction: column; gap: 28px;
      ">
        <img src="/skyway-logo.png" alt="Skyway Aviation"
          style="max-width: 240px; width: 55vw; height: auto; opacity: 0.95;" />
        <div style="display:flex;flex-direction:column;align-items:center;gap:10px;">
          <div style="
            width: 22px; height: 22px;
            border: 2px solid rgba(14,165,233,0.15);
            border-top-color: #0EA5E9;
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
          "></div>
          <span style="
            font-size: 9px; letter-spacing: 0.18em;
            color: rgba(148,163,184,0.45); text-transform: uppercase;
          ">LOADING</span>
        </div>
      </div>
      <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

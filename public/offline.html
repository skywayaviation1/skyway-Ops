<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0B0D" />
    <title>Skyway · Offline</title>
    <style>
      :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        background: #0a0b0d;
        color: #f0f1f3;
      }
      main { width: min(100%, 380px); text-align: center; }
      img { width: 76px; height: 76px; border-radius: 17px; }
      h1 { margin: 24px 0 8px; font-size: 22px; }
      p { margin: 0; color: #b0b5bc; font-size: 14px; line-height: 1.55; }
      button {
        width: 100%;
        min-height: 48px;
        margin-top: 24px;
        border: 1px solid rgba(63,169,204,.4);
        border-radius: 10px;
        background: #3fa9cc;
        color: #06171e;
        font: inherit;
        font-weight: 700;
      }
      .status { margin-top: 14px; font-size: 12px; color: #8c9199; }
    </style>
  </head>
  <body>
    <main>
      <img src="/apple-touch-icon.png" alt="" />
      <h1>Skyway is offline</h1>
      <p>Your operational data is not cached on this device. Reconnect before reviewing flights, duty, messages, or maintenance.</p>
      <button type="button" onclick="location.reload()">Try again</button>
      <p class="status">The app will reconnect automatically when the network returns.</p>
    </main>
    <script>
      addEventListener('online', function () { location.reload(); });
    </script>
  </body>
</html>
